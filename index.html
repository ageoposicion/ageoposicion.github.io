function start(k){const p=k==='p',m=p?'p':F.m;let l=sh(D.filter(x=>p?inSel('p',x):inF(x)));if(!l.length)return;if(m!=='rel')l=l.slice(0,10);Q={L:l,i:0,ok:0,m,left:60,s:0,bs:0};V='quiz';if(m==='rel')Q.T=setInterval(()=>{Q.left--;const e=document.getElementById('tm');if(e)e.textContent=Q.left;if(Q.left<=0)fin()},1000);ask()}
function ask(){const it=Q.L[Q.i%Q.L.length];Q.it=it;Q.o=sh(opts(it));Q.d=0;const p=Q.m==='p';
if(p){clearInterval(Q.T);Q.t=20;Q.T=setInterval(()=>{Q.t--;const e=document.getElementById('tm');if(e)e.textContent=Q.t;if(Q.t<=0)pick(-1)},1000)}
$a.innerHTML=`<div class="bar"><span>${Q.m==='rel'?'⏱ <b id="tm">'+Q.left+'</b> s · ':p?'⏱ <b id="tm">20</b> s · ':''}${Q.i+1}${Q.m==='rel'?'':' / '+Q.L.length}</span><span>${p?'🔥 '+Q.s+' · ':''}✔ ${Q.ok}</span></div><div class="card"><span class="tag">${it.p?'Plazo':'Bloque '+it.b}</span><span class="tag">${it.l} · ${ref(it)}</span><h3>${esc(it.q)}</h3>${Q.o.map((o,j)=>`<button class="opt" onclick="pick(${j})">${esc(o)}</button>`).join('')}<div id="fb"></div></div>`}
function pick(j){if(Q.d)return;Q.d=1;const it=Q.it,ok=j>=0&&Q.o[j]===it.r;if(ok)Q.ok++;if(Q.m==='p'){clearInterval(Q.T);if(ok){Q.s++;Q.bs=Math.max(Q.bs,Q.s)}else Q.s=0}const k=it.p?'P':it.b,s=S.st[k]||[0,0];s[1]++;if(ok)s[0]++;S.st[k]=s;save();
document.querySelectorAll('.opt').forEach((b,x)=>{b.disabled=true;if(Q.o[x]===it.r){b.classList.add('ok');b.insertAdjacentHTML('beforeend','<span class="lbl">✔ CORRECTA</span>')}else if(x===j){b.classList.add('ko');b.insertAdjacentHTML('beforeend','<span class="lbl">✘ TU RESPUESTA</span>')}});
document.getElementById('fb').innerHTML=`<p><b>${ok?'✔ Correcto':j<0?'⏰ Tiempo agotado':'✘ Incorrecto'}</b> · Respuesta: ${esc(it.r)}</p>${it.cita?'<p class="m">Texto del BOE: «'+esc(it.cita)+'»</p>':''}<p class="m">Fundamento: ${it.l}, ${ref(it)}. <a href="${url(it)}" target="_blank" rel="noopener">Comprobar en la fuente</a></p>${it.v?'<div class="vok">✔ Contrastada con el texto del BOE.</div>':'<div class="warn">⚠ Pendiente de verificar contra el texto consolidado vigente.</div>'}<div class="row"><button class="sm" onclick="tf(${it.id},this)">${S.fav[it.id]?'★ Quitar':'☆ Favorita'}</button><button class="sm" onclick="${Q.m==='rel'&&Q.left<=0?'fin()':'nx()'}">Siguiente →</button></div><textarea placeholder="Nota personal…" oninput="sn(${it.id},this.value)">${esc(S.note[it.id]||'')}</textarea>`}
const NW=new Set('dos tres cuatro cinco seis siete ocho nueve diez once doce trece catorce quince dieciséis dieciocho veinte veintiún veintiuno veinticinco treinta cuarenta cincuenta sesenta setenta ochenta noventa cien ciento mil'.split(' ')),TU=/^(d[ií]as?|mes|meses|años?|semanas?|horas?|trimestres?|semestres?|minutos?)$/;
function cat(r){const s=r.toLowerCase(),w=s.split(/[^a-záéíóúüñ0-9]+/).filter(Boolean),num=w.some(x=>/\d/.test(x)||NW.has(x)||x==='un'||x==='una'||x==='uno');
if(num&&w.some(x=>TU.test(x)))return'tiempo';if(/^(sí|si|no)(?![a-záéíóúñ])/.test(s))return'neg';if(/mayor[ií]a|tercios|quintos|cuartas partes|unanimidad|(^|[^a-z])mitad/.test(s))return'mayoria';
if(/\d|€|euros|por 100|por ciento|%/.test(s)||w.some(x=>NW.has(x)))return'cifra';if(/^(El|La|Los|Las|Al)\s+[A-ZÁÉÍÓÚ]/.test(r))return'organo';if(w[0]&&w[0].length>3&&w[0]!=='cualquier'&&/(ar|er|ir)$/.test(w[0]))return'accion';return'texto'}
const PC=[{c:'#0072B2',f:'#fff',b:'solid'},{c:'#E69F00',f:'#000',b:'dashed'},{c:'#F0E442',f:'#000',b:'double'},{c:'var(--t)',f:'var(--c)',b:'dotted'},{c:'#8a8a8a',f:'#000',b:'solid'}];
function startPairs(){const pool=D.filter(x=>inSel('g',x)),g={};pool.forEach(x=>{const k=cat(x.r);(g[k]=g[k]||[]).push(x)});const C=Object.keys(g).filter(k=>new Set(g[k].map(x=>x.r.toLowerCase())).size>=3);if(!C.length){alert('No hay preguntas suficientes con esta selección. Prueba con más leyes o con todo el bloque.');return}G={g,C,n:0,ok:0,err:0,t0:Date.now()};V='pairs';render();round()}
function round(){const w=G.C.map(k=>Math.sqrt(G.g[k].length)),tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot,k=G.C[0];for(let i=0;i<w.length;i++){r-=w[i];if(r<=0){k=G.C[i];break}}const u=new Set(),set=[];for(const it of sh(G.g[k])){const a=it.r.toLowerCase();if(u.has(a))continue;u.add(a);set.push(it);if(set.length===5)break}G.set=set;G.L=sh(set);G.R=sh(set);G.m={};G.col={};G.sel=null;G.chk=false;G.n++;drawP()}
function rof(id){return Object.keys(G.m).find(l=>G.m[l]==id)}
function badge(ci){const c=PC[ci];return`<span style="display:inline-block;min-width:1.5em;text-align:center;border-radius:99px;background:${c.c};color:${c.f};font-weight:800;border:2px solid var(--t);margin-right:6px">${ci+1}</span>`}
function drawP(){const full=Object.keys(G.m).length===G.set.length,tile=(it,s)=>{let lid=s==='L'?(G.m[it.id]!==undefined?it.id:null):rof(it.id),ci=lid!=null?G.col[lid]:null,sel=G.sel&&G.sel.s===s&&G.sel.id===it.id,st='',res='';
if(G.chk&&s==='L'){const ok=G.m[it.id]==it.id;res=`<span class="lbl">${ok?'✔ CORRECTA':'✘ INCORRECTA'}</span>`}
if(ci!=null){const c=PC[ci];st=`style="border:5px ${c.b} ${c.c}"`}
return`<button class="pt ${sel?'sel':''}" ${st} ${G.chk?'disabled':''} onclick="tapP('${s}',${it.id})">${ci!=null?badge(ci):''}${s==='L'?`<small>${esc(lname(it.l))}</small>`:''}${esc(s==='L'?it.q:it.r)}${res}</button>`};
let h=`<div class="bar"><span>🧩 Ronda ${G.n}</span><span>✔ ${G.ok} · ✘ ${G.err}</span></div>`;
if(!G.chk)h+=`<p class="m">Toca una pregunta y después la respuesta que crees que le corresponde (o al revés). Cada pareja recibe un número, un color y un borde. Para deshacer una pareja, vuelve a tocarla. ${full?'<b>Ya tienes todas: pulsa «Comprobar».</b>':'Parejas formadas: '+Object.keys(G.m).length+' de '+G.set.length+'.'}</p>`;
else{const b=G.set.filter(it=>G.m[it.id]==it.id).length;h+=`<div class="card"><b>${b} de ${G.set.length} parejas correctas.</b><p class="m">Las respuestas correctas y el texto del BOE están debajo.</p></div>`}
h+=`<div class="pg"><div>${G.L.map(it=>tile(it,'L')).join('')}</div><div>${G.R.map(it=>tile(it,'R')).join('')}</div></div>`;
if(!G.chk)h+=`<button class="go" ${full?'':'disabled style="opacity:.45"'} onclick="chkP()">Comprobar parejas</button><button class="sm" style="margin-top:8px" onclick="finP()">Terminar</button>`;
else h+=G.set.map(it=>{const mine=G.set.find(x=>x.id==G.m[it.id]),ok=mine===it;return`<div class="card" style="border:3px ${ok?'solid var(--ok)':'dashed var(--ko)'}"><span class="tag">${esc(it.l)} · ${ref(it)}</span><b>${esc(it.q)}</b><p>${ok?'✔ ':'✘ Tu pareja: '+esc(mine?mine.r:'—')+'<br>✔ Correcta: '}<b>${esc(it.r)}</b></p>${it.cita?`<div class="st m">«${esc(it.cita)}»</div>`:''}<a href="${url(it)}" target="_blank" rel="noopener">Ver en el BOE</a></div>`}).join('')+`<button class="go" onclick="round();scrollTo(0,0)">Siguiente ronda</button><button class="go" style="background:var(--c);color:var(--t);border:1px solid var(--b)" onclick="finP()">Terminar</button>`;
$a.innerHTML=h}
function tapP(s,id){if(G.chk)return;const lid=s==='L'?(G.m[id]!==undefined?id:null):rof(id);if(lid!=null&&!(G.sel&&G.sel.s!==s)){delete G.m[lid];delete G.col[lid];G.sel=null;drawP();return}
if(!G.sel||G.sel.s===s){G.sel={s,id};drawP();return}
const L=s==='L'?id:G.sel.id,R=s==='R'?id:G.sel.id;if(G.m[L]!==undefined){delete G.m[L];delete G.col[L]}const o=rof(R);if(o!=null){delete G.m[o];delete G.col[o]}
const used=new Set(Object.values(G.col));let ci=0;while(used.has(ci))ci++;G.m[L]=R;G.col[L]=ci;G.sel=null;drawP()}
function chkP(){if(Object.keys(G.m).length<G.set.length)return;G.chk=true;G.set.forEach(it=>{G.m[it.id]==it.id?G.ok++:G.err++});drawP();scrollTo(0,0)}
function finP(){const t=Math.round((Date.now()-G.t0)/1000),tot=G.ok+G.err;$a.innerHTML=`<div class="card"><h2>Parejas</h2><p style="font-size:2rem;margin:.2em 0"><b>${G.ok}</b> de ${tot} parejas correctas</p><p class="m">${tot?Math.round(100*G.ok/tot):0}% de acierto · ${Math.floor(t/60)} min ${t%60} s</p><button class="go" onclick="startPairs()">Jugar otra vez</button><button class="go" style="background:var(--c);color:var(--t);border:1px solid var(--b)" onclick="nav('home')">Volver</button></div>`}
function tf(id,b){S.fav[id]?delete S.fav[id]:S.fav[id]=1;save();b.textContent=S.fav[id]?'★ Quitar':'☆ Favorita'}
function sn(id,v){v.trim()?S.note[id]=v:delete S.note[id];save()}
function nx(){Q.i++;if(Q.m!=='rel'&&Q.i>=Q.L.length)fin();else ask()}
function fin(){clearInterval(Q.T);const n=Q.m==='rel'?Q.i:Q.L.length;$a.innerHTML=`<div class="card"><h2>Resultado</h2><p style="font-size:2rem;margin:.2em 0"><b>${Q.ok}</b> aciertos</p><p class="m">${Q.m==='rel'?'en 60 segundos':'de '+n+' preguntas'}${Q.m==='p'?' · mejor racha '+Q.bs:''}</p><button class="go" onclick="start(${Q.m==='p'?"'p'":''})">Repetir</button><button class="go" style="background:var(--c);color:var(--t);border:1px solid var(--b)" onclick="nav('home')">Volver</button></div>`}
function lst(ids,empty,note){return ids.length?ids.map(id=>{const it=D.find(x=>x.id==id);if(!it)return'';return`<div class="card"><span class="tag">${it.l} · ${ref(it)}</span><b>${esc(it.q)}</b><p>➜ ${esc(it.r)} <a href="${url(it)}" target="_blank" rel="noopener">Fuente</a></p>${note?`<textarea oninput="sn(${id},this.value)">${esc(S.note[id]||'')}</textarea>`:`<button class="sm" onclick="delete S.fav[${id}];save();favs()">Quitar</button>`}</div>`}).join(''):`<p class="m">${empty}</p>`}
function favs(){$a.innerHTML='<h2>Favoritas</h2>'+lst(Object.keys(S.fav).map(Number),'Marca preguntas con ☆ al responder.',0)}
function notes(){$a.innerHTML='<h2>Notas</h2>'+lst(Object.keys(S.note).map(Number),'Escribe notas al responder una pregunta.',1)}
function more(){
$a.innerHTML=`<h2>Estadísticas</h2>${BK.concat('P').map(b=>{const s=S.st[b]||[0,0],p=s[1]?Math.round(100*s[0]/s[1]):0;return`<div class="card"><div class="row"><b>${b==='P'?'Modo Plazos':b==='C'?'Convocatoria':'Bloque '+b}</b><span class="m">${s[0]}/${s[1]}</span></div><div class="pb"><i style="width:${p}%"></i></div></div>`}).join('')}
<h3>Examen (Anexo III de la convocatoria, BOE-A-2025-26262)</h3><p class="m">Ejercicio único con dos partes eliminatorias. Primera: cuestionario de hasta 70 preguntas (40 de los bloques I a V y 30 del bloque VI, Windows 11 y Microsoft 365) más 5 de reserva. Segunda: supuesto práctico a elegir entre dos, sobre materias de los bloques II a V. Consulta en el <a href="${CV}" target="_blank" rel="noopener">texto oficial</a> la calificación, el tiempo y la penalización.</p>
<h3>Programa</h3><p class="m">${BK.filter(b=>b!=='C').map(b=>bn(b)).join('<br>')}<br>(45 temas en total. El texto íntegro de cada tema está en el Anexo III del BOE.)</p>
<h3>Tus datos</h3><p class="m">Favoritas, notas y estadísticas se guardan solo en este dispositivo.</p><div class="row"><button class="sm" onclick="ex()">Exportar copia</button><button class="sm" onclick="im()">Importar copia</button></div><textarea id="bk" placeholder="Pega aquí tu copia para importar"></textarea>
<h3>Estado del banco</h3><p class="m">${D.filter(x=>x.v).length} de ${D.length} preguntas contrastadas con el BOE. Las demás llevan aviso hasta su revisión.</p>

function ex(){const t=document.getElementById('bk');t.value=JSON.stringify(S);t.select()}
function im(){try{const o=JSON.parse(document.getElementById('bk').value);S={fav:o.fav||{},note:o.note||{},st:o.st||{}};save();more()}catch(e){alert('Copia no válida')}}
fetch('data/bank.json').then(r=>r.ok?r.json():[]).then(a=>{a.forEach(x=>D.push({id:x.n,p:x.t==='plazo'?1:0,b:x.b,l:x.l,a:x.a,q:(x.t==='plazo'?'Plazo de: ':'')+x.q,r:x.o[x.c],d:x.o.filter((_,i)=>i!==x.c),v:true,cita:x.cita,u:x.u}));if(a.length)render()}).catch(()=>{});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
