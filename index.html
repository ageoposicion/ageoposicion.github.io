function ask(){const it=Q.L[Q.i%Q.L.length];Q.it=it;Q.o=sh(opts(it));Q.d=0;const p=Q.m==='p';
if(p){clearInterval(Q.T);Q.t=20;Q.T=setInterval(()=>{Q.t--;const e=document.getElementById('tm');if(e)e.textContent=Q.t;if(Q.t<=0)pick(-1)},1000)}
$a.innerHTML=`<div class="bar"><span>${Q.m==='rel'?'⏱ <b id="tm">'+Q.left+'</b> s · ':p?'⏱ <b id="tm">20</b> s · ':''}${Q.i+1}${Q.m==='rel'?'':' / '+Q.L.length}</span><span>${p?'🔥 '+Q.s+' · ':''}✔ ${Q.ok}</span></div><div class="card"><span class="tag">${it.p?'Plazo':'Bloque '+it.b}</span><span class="tag">${it.l} · ${ref(it)}</span><h3>${esc(it.q)}</h3>${Q.o.map((o,j)=>`<button class="opt" onclick="pick(${j})">${esc(o)}</button>`).join('')}<div id="fb"></div></div>`}
function pick(j){if(Q.d)return;Q.d=1;const it=Q.it,ok=j>=0&&Q.o[j]===it.r;if(ok)Q.ok++;if(Q.m==='p'){clearInterval(Q.T);if(ok){Q.s++;Q.bs=Math.max(Q.bs,Q.s)}else Q.s=0}const k=it.p?'P':it.b,s=S.st[k]||[0,0];s[1]++;if(ok)s[0]++;S.st[k]=s;save();
document.querySelectorAll('.opt').forEach((b,x)=>{b.disabled=true;if(Q.o[x]===it.r){b.classList.add('ok');b.insertAdjacentHTML('beforeend','<span class="lbl">✔ CORRECTA</span>')}else if(x===j){b.classList.add('ko');b.insertAdjacentHTML('beforeend','<span class="lbl">✘ TU RESPUESTA</span>')}});
document.getElementById('fb').innerHTML=`<p><b>${ok?'✔ Correcto':j<0?'⏰ Tiempo agotado':'✘ Incorrecto'}</b> · Respuesta: ${esc(it.r)}</p>${it.cita?'<p class="m">Texto del BOE: «'+esc(it.cita)+'»</p>':''}<p class="m">Fundamento: ${it.l}, ${ref(it)}. <a href="${url(it)}" target="_blank" rel="noopener">Comprobar en la fuente</a></p>${it.v?'<div class="vok">✔ Contrastada con el texto del BOE.</div>':'<div class="warn">⚠ Pendiente de verificar contra el texto consolidado vigente.</div>'}<div class="row"><button class="sm" onclick="tf(${it.id},this)">${S.fav[it.id]?'★ Quitar':'☆ Favorita'}</button><button class="sm" onclick="${Q.m==='rel'&&Q.left<=0?'fin()':'nx()'}">Siguiente →</button></div><textarea placeholder="Nota personal…" oninput="sn(${it.id},this.value)">${esc(S.note[it.id]||'')}</textarea>`}
function startPairs(){const pool=sh(D.filter(x=>inF(x)&&x.r.length<=70&&x.q.length<=170));if(new Set(pool.map(x=>x.r.toLowerCase())).size<2){alert('No hay preguntas suficientes con esta selección');return}G={pool,pi:0,n:0,ok:0,err:0,t0:Date.now()};V='pairs';render();round()}
function round(){const u=new Set(),set=[];let tries=0;while(set.length<5&&tries<2*G.pool.length){if(G.pi>=G.pool.length){G.pi=0;G.pool=sh(G.pool)}const it=G.pool[G.pi++];tries++;const k=it.r.toLowerCase();if(u.has(k)||set.includes(it))continue;u.add(k);set.push(it)}G.set=set;G.L=sh(set);G.R=sh(set);G.done={};G.sel=null;G.bad=null;G.n++;drawP()}
function drawP(){const all=G.set.every(it=>G.done[it.id]),tile=(it,s)=>{const d=G.done[it.id],sel=G.sel&&G.sel.s===s&&G.sel.id===it.id,bad=G.bad&&G.bad.s===s&&G.bad.id===it.id;return`<button class="pt ${d?'ok':bad?'ko':sel?'sel':''}" ${d?'disabled':''} onclick="tapP('${s}',${it.id})">${s==='L'?`<small>${esc(lname(it.l))}</small>`:''}${d?'✔ ':bad?'✘ ':''}${esc(s==='L'?it.q:it.r)}</button>`};
$a.innerHTML=`<div class="bar"><span>🧩 Ronda ${G.n}</span><span>✔ ${G.ok} · ✘ ${G.err}</span></div><p class="m">${all?'¡Ronda completada! Repasa cada pareja:':'Toca una pregunta (izquierda) y después su respuesta (derecha), o al revés.'}</p>${all?G.set.map(it=>`<div class="card"><span class="tag">${esc(it.l)} · ${ref(it)}</span><b>${esc(it.q)}</b><p>➜ ${esc(it.r)}</p>${it.cita?`<div class="st m">«${esc(it.cita)}»</div>`:''}<a href="${url(it)}" target="_blank" rel="noopener">Ver en el BOE</a></div>`).join('')+`<button class="go" onclick="round()">Siguiente ronda</button><button class="go" style="background:var(--c);color:var(--t);border:1px solid var(--b)" onclick="finP()">Terminar</button>`:`<div class="pg"><div>${G.L.map(it=>tile(it,'L')).join('')}</div><div>${G.R.map(it=>tile(it,'R')).join('')}</div></div><button class="sm" style="margin-top:8px" onclick="finP()">Terminar</button>`}`}
function tapP(s,id){if(G.done[id])return;G.bad=null;if(!G.sel||G.sel.s===s){G.sel={s,id};drawP();return}if(G.sel.id===id){G.done[id]=1;G.ok++;G.sel=null;drawP();if(G.set.every(it=>G.done[it.id]))scrollTo(0,0);return}G.err++;G.bad={s,id};G.sel=null;drawP();setTimeout(()=>{if(G&&G.bad&&G.bad.id===id){G.bad=null;drawP()}},900)}
function finP(){const t=Math.round((Date.now()-G.t0)/1000),tot=G.ok+G.err;$a.innerHTML=`<div class="card"><h2>Parejas</h2><p style="font-size:2rem;margin:.2em 0"><b>${G.ok}</b> parejas</p><p class="m">${G.err} fallos · precisión ${tot?Math.round(100*G.ok/tot):0}% · ${Math.floor(t/60)} min ${t%60} s</p><button class="go" onclick="startPairs()">Jugar otra vez</button><button class="go" style="background:var(--c);color:var(--t);border:1px solid var(--b)" onclick="nav('home')">Volver</button></div>`}
function tf(id,b){S.fav[id]?delete S.fav[id]:S.fav[id]=1;save();b.textContent=S.fav[id]?'★ Quitar':'☆ Favorita'}
function sn(id,v){v.trim()?S.note[id]=v:delete S.note[id];save()}
function nx(){Q.i++;if(Q.m!=='rel'&&Q.i>=Q.L.length)fin();else ask()}
function fin(){clearInterval(Q.T);const n=Q.m==='rel'?Q.i:Q.L.length;$a.innerHTML=`<div class="card"><h2>Resultado</h2><p style="font-size:2rem;margin:.2em 0"><b>${Q.ok}</b> aciertos</p><p class="m">${Q.m==='rel'?'en 60 segundos':'de '+n+' preguntas'}${Q.m==='p'?' · mejor racha '+Q.bs:''}</p><button class="go" onclick="start(${Q.m==='p'?"'p'":''})">Repetir</button><button class="go" style="background:var(--c);color:var(--t);border:1px solid var(--b)" onclick="nav('home')">Volver</button></div>`}
function lst(ids,empty,note){return ids.length?ids.map(id=>{const it=D.find(x=>x.id==id);if(!it)return'';return`<div class="card"><span class="tag">${it.l} · ${ref(it)}</span><b>${esc(it.q)}</b><p>➜ ${esc(it.r)} <a href="${url(it)}" target="_blank" rel="noopener">Fuente</a></p>${note?`<textarea oninput="sn(${id},this.value)">${esc(S.note[id]||'')}</textarea>`:`<button class="sm" onclick="delete S.fav[${id}];save();favs()">Quitar</button>`}</div>`}).join(''):`<p class="m">${empty}</p>`}
function favs(){$a.innerHTML='<h2>Favoritas</h2>'+lst(Object.keys(S.fav).map(Number),'Marca preguntas con ☆ al responder.',0)}
function notes(){$a.innerHTML='<h2>Notas</h2>'+lst(Object.keys(S.note).map(Number),'Escribe notas al responder una pregunta.',1)}
function more(){
$a.innerHTML=`<h2>Estadísticas</h2>${BK.concat('P').map(b=>{const s=S.st[b]||[0,0],p=s[1]?Math.round(100*s[0]/s[1]):0;return`<div class="card"><div class="row"><b>${b==='P'?'Modo Plazos':b==='C'?'Convocatoria':'Bloque '+b}</b><span class="m">${s[0]}/${s[1]}</span></div><div class="pb"><i style="width:${p}%"></i></div></div>`}).join('')}
<h3>Examen (Anexo III de la convocatoria, BOE-A-2025-26262)</h3><p class="m">Ejercicio único con dos partes eliminatorias. Primera: cuestionario de hasta 70 preguntas (40 de los bloques I a V y 30 del bloque VI, Windows 11 y Microsoft 365) más 5 de reserva. Segunda: supuesto práctico a elegir entre dos, sobre materias de los bloques II a V. Consulta en el <a href="${CV}" target="_blank" rel="noopener">texto oficial</a> la calificación, el tiempo y la penalización.</p>
<h3>Programa</h3><p class="m">${BK.filter(b=>b!=='C').map(b=>bn(b)).join('<br>')}<br>(45 temas en total. El texto íntegro de cada tema está en el Anexo III del BOE.)</p>
<h3>Tus datos</h3><p class="m">Favoritas, notas y estadísticas se guardan solo en este dispositivo.</p><div class="row"><button class="sm" onclick="ex()">Exportar copia</button><button class="sm" onclick="im()">Importar copia</button></div><textarea id="bk" placeholder="Pega aquí tu copia para importar"></textarea>
<h3>Estado del banco</h3><p class="m">${D.filter(x=>x.v).length} de ${D.length} preguntas contrastadas con el BOE. Las demás llevan aviso hasta su revisión.</p>
<h3>Información legal</h3><p class="m">AgeOposicion es una herramienta de estudio no oficial; no está afiliada al INAP, a la AGE ni a ninguna plataforma de preparación. Puede contener errores: contrasta siempre con el texto vigente del BOE. No usa cookies ni envía tus datos a ningún servidor.<br>Fuente de los datos: <a href="https://www.boe.es" target="_blank" rel="noopener">Agencia Estatal Boletín Oficial del Estado</a>.<br>Contacto y reporte de errores: <a href="mailto:oposdiego@gmail.com">oposdiego@gmail.com</a></p>`}
function ex(){const t=document.getElementById('bk');t.value=JSON.stringify(S);t.select()}
function im(){try{const o=JSON.parse(document.getElementById('bk').value);S={fav:o.fav||{},note:o.note||{},st:o.st||{}};save();more()}catch(e){alert('Copia no válida')}}
fetch('data/bank.json').then(r=>r.ok?r.json():[]).then(a=>{a.forEach(x=>D.push({id:x.n,p:x.t==='plazo'?1:0,b:x.b,l:x.l,a:x.a,q:(x.t==='plazo'?'Plazo de: ':'')+x.q,r:x.o[x.c],d:x.o.filter((_,i)=>i!==x.c),v:true,cita:x.cita,u:x.u}));if(a.length)render()}).catch(()=>{});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
